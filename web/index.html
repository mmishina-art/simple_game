<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6feb">
  <title>ヒット＆ブロー</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ヒット＆ブロー">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <h1>ヒット＆ブロー</h1>

    <!-- 難易度を選ぶ画面 -->
    <section id="start-screen">
      <details class="rules" open>
        <summary>ルール</summary>
        <ul>
          <li>0〜9 の数字を重複なしで並べた答えを当てます（先頭が 0 のこともあります）。</li>
          <li>数字も場所も合っていれば<strong>ヒット</strong>、数字だけ合っていれば<strong>ブロー</strong>です。<br>
            例: 答えが 1234 で 1395 と入力すると、1 ヒット 1 ブロー</li>
          <li><span id="max-tries"></span> 回以内に全部ヒットにすれば勝ちです。</li>
        </ul>
      </details>
      <h2>難易度を選んでください</h2>
      <div id="difficulty-buttons" class="difficulty-buttons"></div>
    </section>

    <!-- ゲーム画面 -->
    <section id="game-screen" hidden>
      <p id="status" class="status"></p>
      <ol id="history" class="history"></ol>
      <div id="result" class="result" hidden></div>

      <div id="input-area">
        <p id="hint" class="hint" hidden></p>
        <div id="slots" class="slots" aria-live="polite"></div>
        <div id="keypad" class="keypad"></div>
        <div class="actions">
          <button id="delete-button" type="button" class="secondary">1 文字消す</button>
          <button id="submit-button" type="button" class="primary">決定</button>
        </div>
        <div class="sub-actions">
          <button id="hint-button" type="button" class="link" aria-pressed="false">ヒントを表示</button>
          <button id="give-up-button" type="button" class="link">ギブアップ</button>
        </div>
      </div>

      <div id="end-actions" class="actions" hidden>
        <button id="retry-button" type="button" class="primary">もう一度</button>
        <button id="menu-button" type="button" class="secondary">難易度を選ぶ</button>
      </div>
    </section>
  </main>
</body>
</html>
